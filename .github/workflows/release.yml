name: Release

# Tag a version to publish it:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: node scripts/build.js

      - name: Verify
        run: node scripts/verify.js

      # Refuse to ship a tag that disagrees with package.json — a mismatched version in
      # the plugin manager is confusing and cannot be fixed without a new release.
      - name: Check tag matches package.json
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json $PKG"
            exit 1
          fi

      # npm pack honours the "files" field, so the archive carries dist/ and the entry
      # points and nothing else. NocoBase's plugin manager accepts this layout directly.
      - name: Pack
        id: pack
        run: |
          FILE=$(npm pack --silent)
          NAME="plugin-icon-packs-${{ github.event.inputs.tag || github.ref_name }}.tar.gz"
          mv "$FILE" "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"
          tar -tzf "$NAME" | head -20

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" "${{ steps.pack.outputs.file }}" \
            --title "$TAG" \
            --generate-notes \
            --notes "Install: NocoBase → Plugin manager → Add new → upload \`${{ steps.pack.outputs.file }}\`, then enable.

          Icons are Font Awesome Free 6.7.2, CC BY 4.0, © Fonticons, Inc. See NOTICE."
