name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The generated pack data (packs/*/manifest.json, paths.json) is committed, so the
      # build is hermetic — no network, no dependencies. Refreshing artwork from upstream
      # is a deliberate manual step (scripts/build-pack.js), not something CI does silently.
      - name: Build
        run: node scripts/build.js

      - name: Verify
        run: node scripts/verify.js

      # Guard the promise the README makes: names ship eagerly, path data does not.
      # The bundle grows with the number of icon NAMES, so the ceiling is generous —
      # what it actually catches is path data leaking in, which would add megabytes.
      - name: Check path data stays out of the eager bundle
        run: |
          BUNDLE=$(stat -c%s dist/client/index.js)
          LAZY=$(cat dist/client/packs/*/paths.json | wc -c)
          echo "eager bundle = $BUNDLE bytes | lazy path data = $LAZY bytes"
          if [ "$BUNDLE" -gt 409600 ]; then
            echo "::error::eager bundle is over 400 KB — path data has probably leaked into it."
            exit 1
          fi
          if [ "$LAZY" -lt 500000 ]; then
            echo "::error::lazy path data is suspiciously small — is it still being shipped separately?"
            exit 1
          fi
